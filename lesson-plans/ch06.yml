# 第 6 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 6
online: 5
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出数据库设计的六个阶段，以及每个阶段的主要成果
  - 区分实体、属性和联系，判断两个实体之间是一对一、一对多还是多对多
  skill:
  - 画出一个小业务的 E-R 图，看懂陈氏表示法和乌鸦脚表示法
  - 按规则把 E-R 图转换成关系模式，并写出建表语句
  - 找出一份设计里的常见错误，并提出修改意见
  quality:
  - 养成先调研需求、与业务人员沟通确认再动手的工作方法
  - 通过小组设计和互评，培养团队协作和规范编写文档的能力
key_points:
- 数据库设计的六个阶段
- 数据字典
- 实体、属性、联系和三种联系类型
- E-R 图转换为关系模式的规则
- 常见的设计错误
difficulties:
- point: 判断联系的类型（一对一、一对多、多对多）
  solution: 两个方向各问一次“一个 A 对应几个 B”，用小店和学校的熟悉例子反复练习
- point: E-R 图转关系模式时外键放在哪一边、何时要建中间表
  solution: 用“E-R 图转换成表”动画演示三种联系，再做实验 6-1 的报修 E-R 图
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 20
    content: 6.1 数据库设计的六个阶段
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 说出数据库设计的六个阶段
  - name: 自主学习
    minutes: 20
    content: 6.2 需求分析：弄清楚要记什么、业务流程、数据字典
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会从业务流程中找出要记录的数据并写数据字典
  - name: 自主学习
    minutes: 30
    content: 6.3 概念设计：画 E-R 图：实体、属性、联系、三种联系、E-R 图的两种画法、画图工具
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 会画 E-R 图并判断联系类型
  - name: 自主学习
    minutes: 40
    content: 6.4 逻辑设计：E-R 图转成关系模式：转换规则、转换示例
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会把 E-R 图转换成关系模式
  - name: 自主学习
    minutes: 20
    content: 6.5 物理设计
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解物理设计要考虑的内容
  - name: 自主学习
    minutes: 40
    content: 6.6 常见的设计错误
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 能识别常见的设计错误
  - name: 自主学习
    minutes: 10
    content: 6.7 前沿视窗：用文字“画”E-R 图
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用 Mermaid 文字画 E-R 图
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小店生意越来越好，老板想做两件新事……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 6.3 概念设计：画 E-R 图：实体、属性、联系、三种联系、E-R 图的两种画法、画图工具
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会画 E-R 图并判断联系类型
  - name: 重点讲解
    minutes: 15
    content: 6.4 逻辑设计：E-R 图转成关系模式：转换规则、转换示例
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会把 E-R 图转换成关系模式
  - name: 重点讲解
    minutes: 15
    content: 6.6 常见的设计错误
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 能识别常见的设计错误
  - name: 分层练习
    minutes: 20
    content: 按基础题、提高题两层安排本章重点内容的课堂练习（写 SQL 或设计题），学生独立完成后同桌互查
    teacher: 分层布置练习，巡视指导，投屏讲评典型错误
    student: 独立完成练习，上机验证，同桌互查
    intent: 通过练习突破本章难点
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 6-1 读 E-R 图，写关系模式
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：简述 E-R 图转换为关系模式的四条规则。
- 简答题：怎样判断一个事物应该作为实体还是作为属性？举例说明。
- 简答题：为什么订单明细表中存了 unit_price，不算“同一信息存多处”的错误？
- 实操题：某驾校要管理学员练车预约：学员（学员号、姓名、电话）、教练（教练号、姓名、准驾车型）、教练车（车牌号、车型）。一名学员有一名固定教练，一名教练带多名学员；学员每次练车要预约一个时段，记录日期、时段和使用的教练车，一辆车每个时段只能被一名学员使用。① 找出实体和联系，写出联系类型；② 写出关系模式。
- 实操题：为上题的 booking 表写出 MySQL 建表语句，时段只能是“上午”“下午”“晚上”之一。
- 实验报告：实验 6-1、实验 6-2、实验 6-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
