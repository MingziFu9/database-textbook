# 第 11 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 11
online: 6
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出程序访问数据库的五个步骤，以及驱动、连接、游标各自的作用
  - 解释拼接字符串为什么会造成 SQL 注入，参数化查询为什么能防住它
  skill:
  - 使用 PyMySQL 完成查询、插入，并在程序里用事务完成下单
  - 使用窗口函数完成排名、累计和环比计算，并用 pandas 读取结果、画图
  - 分析一个小应用应当怎样分层：界面、业务函数、数据库各管什么
  quality:
  - 写程序时把安全放在第一位：参数化查询、口令不写进代码
  - 体会“数据驱动决策”，用分析结果为经营提出建议
key_points:
- 驱动、连接与游标
- 参数化查询防注入
- 程序中的事务
- pandas 读写数据库
- 窗口函数：排名、累计与环比
difficulties:
- point: 连接、游标、提交的关系，以及事务在程序中的写法
  solution: 画出“连接—游标—执行—取结果—提交/回滚—关闭”的流程图，对照 lab11_1_pymysql.py 逐行讲解
- point: 窗口函数与 GROUP BY 的区别
  solution: 同一个问题（每个类别里价格排名）分别用 GROUP BY 和窗口函数写，对比结果行数
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 20
    content: 11.1 程序怎样访问数据库：驱动、连接与游标、第一个程序、用 with 自动关闭，用字典取列
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用 PyMySQL 连接数据库并查询
  - name: 自主学习
    minutes: 30
    content: 11.2 参数化查询：堵住 SQL 注入：两种写法的对比、参数化查询的写法规则
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 会用参数化查询防住 SQL 注入
  - name: 自主学习
    minutes: 40
    content: 11.3 在程序里写增删改和事务：连接配置不写进代码、增删改要提交、用事务完成下单
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会在程序中增删改并使用事务
  - name: 自主学习
    minutes: 20
    content: 11.4 pandas 读写数据库：read_sql、to_sql
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用 pandas 读写数据库
  - name: 自主学习
    minutes: 40
    content: 11.5 数据挖掘入门：窗口函数：GROUP BY 的局限、排名、累计与环比、用 SQL + pandas 做月度销售分析
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用窗口函数做排名和环比分析
  - name: 自主学习
    minutes: 20
    content: 11.6 一个完整的小应用：小店管理助手：分层、用 Streamlit 做界面
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解分层设计，能运行小店管理助手
  - name: 自主学习
    minutes: 10
    content: 11.7 前沿视窗：ORM 与 Text-to-SQL 智能助手
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解 ORM 和 Text-to-SQL
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小店的数据库建好了，权限分好了，备份也做了。可老板还是不满意：“我又不会写 SQL，每次想看看哪些商品快卖完了，都得打电……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 11.2 参数化查询：堵住 SQL 注入：两种写法的对比、参数化查询的写法规则
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会用参数化查询防住 SQL 注入
  - name: 重点讲解
    minutes: 10
    content: 11.3 在程序里写增删改和事务：连接配置不写进代码、增删改要提交、用事务完成下单
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会在程序中增删改并使用事务
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 9 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 11-1 用 PyMySQL 查询、插入和事务下单
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 线上实验
    minutes: 45
    content: 实验 11-2 用窗口函数和 pandas 做月度销售分析
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 9 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：说明数据库驱动、连接、游标三者的作用和关系。
- 简答题：什么是窗口函数？它和 GROUP BY 分组统计有什么不同？举一个适合用窗口函数的例子。
- 简答题：某同学写的选课程序中，按钮代码里直接用拼接字符串写了 SQL，数据库连接使用 root 账号，口令写在代码第一行。指出其中的问题并提出改进办法。
- 实操题：选课库 school 中有成绩表 sc(sno, cno, grade) 和课程表 course(cno, cname)。写一条 SQL：查询每门课程成绩前 3 名的学生（学号、课程名、成绩、名次），并列时名次相同。
- 实操题：用 PyMySQL 写一个函数 `add_score(sno, cno, grade)`，向 sc 表插入一条成绩记录：要求使用参数化查询；插入成功提交，出错回滚并把错误继续抛出；连接最后一定关闭。可以使用本章的 `get_connection()`。
- 实验报告：实验 11-1、实验 11-2、实验 11-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
