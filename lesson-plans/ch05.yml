# 第 5 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 5
online: 7
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出内连接、左外连接、右外连接、全外连接各保留哪些行
  - 解释忘写连接条件为什么会得到笛卡尔积，`NOT IN` 遇到 NULL 为什么会查不出结果
  skill:
  - 写出两表、多表连接和自连接查询，写出 WHERE、FROM、SELECT 中的子查询
  - 用 UNION 合并结果，用 WITH 把复杂查询拆成几步
  - 按步骤分析一个业务问题需要哪些表、怎样连接，并检查结果的行数是否合理
  quality:
  - 面对复杂需求能拆成小步骤逐步求解，培养分析问题的条理性
key_points:
- 内连接与多表连接
- 左外连接与找“缺失”的数据
- 自连接
- 子查询（WHERE、FROM 中）
- UNION 与 WITH
difficulties:
- point: 内连接和外连接的区别，以及外连接中 ON 和 WHERE 放条件的不同结果
  solution: 用“四种连接对比”动画和 joindemo 小表逐行演示，再对比条件放 ON 与放 WHERE 的结果行数
- point: 相关子查询的执行过程
  solution: 用“对外层每一行执行一次内层”的方式，在黑板上对两三行手工演示
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 20
    content: 5.1 为什么要连接：笛卡尔积、表别名
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 理解为什么要连接，避免笛卡尔积
  - name: 自主学习
    minutes: 35
    content: 5.2 内连接：两表连接、多表连接、连接以后再分组
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会写两表和多表内连接
  - name: 自主学习
    minutes: 40
    content: 5.3 外连接：内连接会“丢”行、左外连接和右外连接、全外连接的替代写法、ON 和 WHERE 放条件的区别
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画、在“试一试”框里运行 SQL，完成节后小测
    intent: 会用外连接保留行、找出缺失数据
  - name: 自主学习
    minutes: 20
    content: 5.4 自连接
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会用自连接查上下级
  - name: 自主学习
    minutes: 40
    content: 5.5 子查询：WHERE 中的子查询、相关子查询、FROM 中的子查询（派生表）、SELECT 中的子查询等
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会写各种子查询
  - name: 自主学习
    minutes: 20
    content: 5.6 集合操作：UNION
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会用 UNION 合并结果
  - name: 自主学习
    minutes: 20
    content: 5.7 用 WITH 把长查询拆成几步
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会用 WITH 拆分长查询
  - name: 自主学习
    minutes: 20
    content: 5.8 怎样一步步写出复杂查询
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 掌握分步写复杂查询的方法
  - name: 自主学习
    minutes: 10
    content: 5.9 前沿视窗：当连接多到写不动——图数据库
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解图数据库适合的场景
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：老顾客王芳（顾客编号 81）来店里问：“我上个月在你们这儿买过一种面粉，挺好用的，叫什么来着？”……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 5.2 内连接：两表连接、多表连接、连接以后再分组
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会写两表和多表内连接
  - name: 重点讲解
    minutes: 15
    content: 5.3 外连接：内连接会“丢”行、左外连接和右外连接、全外连接的替代写法、ON 和 WHERE 放条件的区别
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会用外连接保留行、找出缺失数据
  - name: 重点讲解
    minutes: 15
    content: 5.5 子查询：WHERE 中的子查询、相关子查询、FROM 中的子查询（派生表）、SELECT 中的子查询等
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会写各种子查询
  - name: 分层练习
    minutes: 20
    content: 按基础题、提高题两层安排本章重点内容的课堂练习（写 SQL 或设计题），学生独立完成后同桌互查
    teacher: 分层布置练习，巡视指导，投屏讲评典型错误
    student: 独立完成练习，上机验证，同桌互查
    intent: 通过练习突破本章难点
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 5-1 四种连接对比
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 线上实验
    minutes: 45
    content: 实验 5-2 用连接和子查询完成小店的八个查询
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用实验 5-1 的两张表为例，说明内连接、左外连接、右外连接、全外连接的区别。
- 简答题：为什么 `NOT IN` 子查询在遇到 NULL 时会查不出结果？应该怎样避免？
- 简答题：写一个复杂的多表查询，可以按哪几步进行？
- 实操题：基于示例库 shop 写出 SQL：① 查询每个供应商供应的商品种数，显示供应商名称，按种数从多到少排列；② 查询 2026 年 6 月每位收银员（position 为“收银员”）经手的已完成订单数，显示员工姓名。
- 实操题：基于示例库 shop 写出 SQL：查询“售价高于本类别平均售价”的商品，显示商品名、类别名、售价和本类别平均售价（保留 2 位小数）。要求用 WITH 先算出各类别的平均售价，再与商品表、类别表连接。
- 实验报告：实验 5-1、实验 5-2、实验 5-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
