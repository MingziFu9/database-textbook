# 第 7 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 7
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出数据冗余会带来的三种异常，并能在一张表里举例指出
  - 写出一张表中的函数依赖，区分完全依赖、部分依赖和传递依赖
  skill:
  - 判断一张表属于第几范式，按步骤把它拆分到第三范式
  - 验证拆分后的表能通过连接“拼回”原表，且异常消失
  - 评价一处反规范化设计是否值得，以及需要什么措施保证数据一致
  quality:
  - 理解“一个事实只记一次”的设计原则，养成精益求精的设计态度
  - 懂得在规范与性能之间权衡，按实际需要做决定
key_points:
- 数据冗余与三种异常
- 函数依赖、部分依赖、传递依赖
- 1NF、2NF、3NF 的判断与拆分
- 范式判断题的答题步骤
- 反规范化
difficulties:
- point: 找出部分依赖和传递依赖
  solution: 先列出所有函数依赖，再按“码的一部分决定别的列”“非主属性决定非主属性”两条规则逐条检查，配合“从大表到第三范式”动画
- point: 拆分后要“拆得开、拼得回”
  solution: 拆分后用连接把表拼回去，核对行数是否与原表一致（实验 7-2 的 174 行）
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 25
    content: 7.1 数据冗余与三种异常：一张“什么都往里放”的大表、三种异常
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 能从大表中找出冗余和三种异常
  - name: 自主学习
    minutes: 50
    content: 7.2 函数依赖：“知道了 A，就能确定 B”、完全依赖、部分依赖、传递依赖
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会写出函数依赖，识别部分依赖和传递依赖
  - name: 自主学习
    minutes: 45
    content: 7.3 第一、第二、第三范式：第一范式（1NF）、第二范式（2NF）、第三范式（3NF）、拆分要“拆得开、拼得回”
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 会判断并拆分到第三范式
  - name: 自主学习
    minutes: 25
    content: 7.4 BC 范式
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解 BC 范式
  - name: 自主学习
    minutes: 45
    content: 7.5 范式判断题的答题步骤
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 掌握范式判断题的答题步骤
  - name: 自主学习
    minutes: 25
    content: 7.6 反规范化：故意保留一些冗余
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解反规范化的适用场合
  - name: 自主学习
    minutes: 10
    content: 7.7 前沿视窗：大数据时代的“宽表”
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解大数据宽表与范式的关系
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小店刚开张时，小林在 Excel 里记账，一张表记下了所有东西：订单号、时间、顾客姓名、顾客电话、商品名、类别、单价、数……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 7.2 函数依赖：“知道了 A，就能确定 B”、完全依赖、部分依赖、传递依赖
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会写出函数依赖，识别部分依赖和传递依赖
  - name: 重点讲解
    minutes: 15
    content: 7.3 第一、第二、第三范式：第一范式（1NF）、第二范式（2NF）、第三范式（3NF）、拆分要“拆得开、拼得回”
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会判断并拆分到第三范式
  - name: 重点讲解
    minutes: 15
    content: 7.5 范式判断题的答题步骤
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 掌握范式判断题的答题步骤
  - name: 分层练习
    minutes: 20
    content: 按基础题、提高题两层安排本章重点内容的课堂练习（写 SQL 或设计题），学生独立完成后同桌互查
    teacher: 分层布置练习，巡视指导，投屏讲评典型错误
    student: 独立完成练习，上机验证，同桌互查
    intent: 通过练习突破本章难点
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 7-1 判断范式
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是插入异常、删除异常和更新异常？各举一个小店的例子。
- 简答题：分别说明 2NF 和 3NF 要消除的是哪种依赖，用口诀概括。
- 简答题：订单表存储“订单总金额”有什么好处和风险？如果要这样设计，需要采取哪些措施？
- 实操题：关系模式 借阅(**借书证号, 图书编号, 借书日期**, 读者姓名, 读者电话, 书名, 出版社, 出版社地址, 还书日期)，函数依赖：借书证号 → 读者姓名, 读者电话；图书编号 → 书名, 出版社；出版社 → 出版社地址；(借书证号, 图书编号, 借书日期) → 还书日期。① 判断它最高属于第几范式，说明理由；② 分解到 3NF。
- 实操题：在实验 7-2 的 normdemo 库中，写 SQL 检查 `product_name → product_id` 是否被数据违反；再写出把 product3 拆成 product3b(product_id, product_name, category_id) 和 category3(category_id, category_name) 时，用 `CREATE TABLE … AS SELECT` 建 category3 的语句（category_id 可以用 `ROW_NUMBER() OVER (ORDER BY category_name)` 生成，第 11 章会讲这个函数）。
- 实验报告：实验 7-1、实验 7-2、实验 7-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
