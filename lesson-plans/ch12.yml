# 第 12 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 12
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出嵌入、向量数据库、近似最近邻、检索增强生成等概念的含义
  - 解释为什么关键词搜索找不到“意思相近”的内容，而向量搜索可以
  - 解释 HNSW 和 IVF 加速查找的思路，以及召回率与速度的权衡
  skill:
  - 计算两个向量的余弦相似度、欧氏距离和内积，并找出最近的 K 个
  - 比较向量数据库与关系数据库，能为一个应用场景选择合适的向量存储方案
  quality:
  - 正确认识向量检索结果的近似性，不盲信检索和大模型的输出
  - 了解知识库中的数据安全和权限问题，树立数据合规意识
key_points:
- 关键词搜索的局限
- 向量与嵌入
- 余弦相似度与欧氏距离
- 近似最近邻与 HNSW、召回率
- Chroma 与 pgvector 的基本操作
- RAG 的流程
difficulties:
- point: 向量和相似度的含义
  solution: 先用 4 维手工向量手算余弦相似度，再用“词语向量空间”动画拖动查询点观察
- point: 近似最近邻为什么能更快、召回率是什么
  solution: 用“HNSW 分层搜索”动画调节 ef_search，对照 12.4.3 节 10 万条向量的实测表
