homework:
- 简答题：用自己的话说明：向量数据库为什么能“按意思”找到内容？它和关系数据库在查询结果上最大的区别是什么？
- 简答题：什么是召回率？结合 12.4.3 节的实测数据，说明 HNSW 的 ef_search 参数怎样影响召回率和速度，以及应该怎样选择。
- 简答题：简述检索增强生成（RAG）的流程，并指出哪些步骤属于数据库的工作。
- 实操题：已知问题向量 q = [1, 1, 0]，三门课程的向量：数据库 d = [1, 0, 0]、机器学习 m = [1, 1, 1]、体育 s = [0, 0, 1]。分别计算 q 与三者的余弦相似度（保留 4 位小数），并按相似度从高到低排序。
- 实操题：在 PostgreSQL + pgvector 中，为选课系统建一张课程向量表 course_vec（课程号 cno、课程名 cname、学分 credit、3 维向量 embedding），插入上题的三门课程（学分分别为 4、3、1），写出 SQL：① 建表并插入数据；② 查询与 [1, 1, 0] 余弦距离最近的 2 门课程；③ 只在学分不少于 3 的课程中查询最近的 1 门；④ 为向量列建 HNSW 索引。
- 实验报告：实验 12-1、实验 12-2、实验 12-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
