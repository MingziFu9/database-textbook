# 第 1 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 1
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出数据、数据库、数据库管理系统、数据库系统四个概念的含义和相互关系
  - 解释数据库比 Excel 和普通文件强在哪里，以及三级模式和数据独立性的意思
  - 说出常见的国产数据库，以及数据库在人工智能项目中的作用
  skill:
  - 区分关系型数据库、NoSQL 数据库和向量数据库，能为一个业务场景选出合适的类型
  - 完成本课实验环境的安装：装好 MySQL 8.4 和 DBeaver（或用 Docker 一键启动），连上数据库并运行第一条 SQL
  quality:
  - 认识国产数据库的发展，增强信息技术自主可控意识
  - 养成“先看数据、再下结论”的习惯，体会数据管理工作的规范与严谨
key_points:
- 数据、数据库、数据库管理系统和数据库系统
- 数据库与 Excel 的区别
- 关系型、NoSQL、向量数据库的适用场景
- MySQL 与 DBeaver 的安装和第一条 SQL
difficulties:
- point: 数据、数据库、数据库管理系统、数据库系统几个概念容易混淆
  solution: 用小店的例子一一对应：账本里的记录是数据，shop 库是数据库，MySQL 是数据库管理系统，加上收银软件和管理员小林才是数据库系统
- point: 三级模式与数据独立性比较抽象
  solution: 用“收银员看到的商品清单—全部表结构—硬盘上的文件”三个层次类比，只要求说出各层是什么和独立性的好处
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 30
    content: 1.1 什么是数据库：数据、信息与数据库、数据库管理系统与数据库系统、数据库比 Excel 强在哪里
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 分清数据、数据库、DBMS 和数据库系统，说出数据库比 Excel 强在哪里
  - name: 自主学习
    minutes: 20
    content: 1.2 数据管理的发展：从人工管理到数据库系统、三级模式与数据独立性
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 了解数据管理的发展和三级模式
  - name: 自主学习
    minutes: 40
    content: 1.3 数据库家族：关系型数据库、NoSQL 数据库、向量数据库
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画、在“试一试”框里运行 SQL，完成节后小测
    intent: 能根据业务场景选择合适的数据库类型
  - name: 自主学习
    minutes: 20
    content: 1.4 国产数据库：为什么要关注国产数据库、常见的国产数据库
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 了解主要国产数据库及其兼容性
  - name: 自主学习
    minutes: 20
    content: 1.5 数据库与人工智能
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 了解数据库在人工智能中的作用
  - name: 自主学习
    minutes: 40
    content: 1.6 本课怎么学：本课用到的工具、第一次运行 SQL、学习建议
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 装好工具，运行第一条 SQL
  - name: 自主学习
    minutes: 10
    content: 1.7 前沿视窗：用自然语言问数据库
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解用自然语言查询数据库的思路和局限
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：幸福里社区的“社区小店”开了快两年，卖米面粮油、早餐、零食、日用品，常客有两百来位。上学期，店里的小林学了 Python……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 1.1 什么是数据库：数据、信息与数据库、数据库管理系统与数据库系统、数据库比 Excel 强在哪里
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 分清数据、数据库、DBMS 和数据库系统，说出数据库比 Excel 强在哪里
  - name: 重点讲解
    minutes: 10
    content: 1.3 数据库家族：关系型数据库、NoSQL 数据库、向量数据库
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 能根据业务场景选择合适的数据库类型
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 1-1 在网页“试一试”里跑第一批 SQL
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：结合社区小店的例子，说说数据库比 Excel 强在哪些方面（至少三点）。
- 简答题：什么是三级模式？什么是数据独立性？
- 简答题：为什么学人工智能的同学也要学数据库？
- 实操题：在 DBeaver（或网页“试一试”）里查出员工表 `employee` 的全部数据，写出 SQL 语句，并说出员工表一共有几行、店长的名字是什么。
- 实操题：在网页“试一试”里，查出价格低于 5 元的商品名称和价格。
- 实验报告：实验 1-1、实验 1-2、实验 1-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
