  - name: 自主学习
    minutes: 25
    content: 8.6 查询优化的实用习惯：六条习惯、用慢查询日志找到慢 SQL
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
