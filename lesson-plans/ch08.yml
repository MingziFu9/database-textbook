- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小店开了网上订货以后，订单越来越多。表哥帮小林模拟了一下三年后的样子：订单表有 100 万行，2 万位顾客。
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 8.2 索引是什么：书的目录、B+ 树、聚簇索引和二级索引
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 理解索引和 B+ 树的原理
  - name: 重点讲解
    minutes: 15
    content: 8.4 看懂执行计划：EXPLAIN：EXPLAIN 的用法、先会看三列
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会用 EXPLAIN 判断查询是否用上索引
  - name: 重点讲解
    minutes: 15
    content: 8.5 让索引失效的常见写法
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 能识别并改写让索引失效的写法
  - name: 分层练习
    minutes: 20
    content: 按基础题、提高题两层安排本章重点内容的课堂练习（写 SQL 或设计题），学生独立完成后同桌互查
    teacher: 分层布置练习，巡视指导，投屏讲评典型错误
