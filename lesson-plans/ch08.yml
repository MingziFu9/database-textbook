# 第 8 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 8
online: 7
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出视图和表的区别、视图的三种用途，以及哪些视图不能修改
  - 解释索引为什么能让查询变快，聚簇索引和二级索引的区别，以及索引的代价
  skill:
  - 创建视图、普通索引、唯一索引和组合索引，按最左前缀原则设计组合索引
  - 读懂 EXPLAIN 结果中的 type、key、rows 三列，判断一条查询是否用上了索引
  - 找出让索引失效的写法并改写，用慢查询日志找到慢 SQL
  quality:
  - 建立性能意识，用数据（执行计划、耗时）而不是感觉判断优化效果
  - 通过视图控制可见数据，树立数据安全意识
key_points:
- 视图的作用与创建
- 索引的原理（B+ 树）
- 聚簇索引与二级索引
- 组合索引与最左前缀
- EXPLAIN 的三列
- 让索引失效的写法
difficulties:
- point: B+ 树为什么能让查询变快
  solution: 用“B+ 树查找”动画演示从根到叶子只读 3 个节点，再对比全表扫描的行数
- point: 读懂 EXPLAIN、判断索引是否失效
  solution: 只看 type、key、rows 三列；在 100 万行表上对比有无索引和几种“失效写法”的执行计划
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 25
    content: 8.1 视图：视图是“存起来的查询”、视图的三种用途、通过视图修改数据
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会建视图，说出视图的三种用途
  - name: 自主学习
    minutes: 50
    content: 8.2 索引是什么：书的目录、B+ 树、聚簇索引和二级索引
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 理解索引和 B+ 树的原理
  - name: 自主学习
    minutes: 25
    content: 8.3 创建和管理索引：四种常用索引、组合索引与最左前缀、什么列该建索引，什么列不该、索引的代价
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会建各种索引，知道什么列该建
  - name: 自主学习
    minutes: 45
    content: 8.4 看懂执行计划：EXPLAIN：EXPLAIN 的用法、先会看三列
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用 EXPLAIN 判断查询是否用上索引
  - name: 自主学习
    minutes: 45
    content: 8.5 让索引失效的常见写法
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
