homework:
- 简答题：用“书的目录”比喻说明索引为什么能加快查询，并说明索引的代价。
- 简答题：什么是组合索引的最左前缀原则？举例说明。
- 简答题：拿到一条慢 SQL，你会按什么步骤优化它？
- 实操题：基于示例库 shop：① 创建视图 v_member_info，显示会员编号、顾客姓名、电话、会员等级和积分（连接 member 和 customer）；② 用这个视图查询积分超过 2000 的会员，按积分从高到低排列。
- 实操题：小店网上订货最常用的两个查询是：“按手机号找顾客”和“查某位顾客某段时间的订单”。为 customer 表和 orders 表设计索引，写出 CREATE INDEX 语句；并把下面这条查询改写成能用上索引的形式：`SELECT * FROM orders WHERE customer_id = 28 AND YEAR(order_time) = 2026;`
- 实验报告：实验 8-1、实验 8-2、实验 8-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
