# 第 10 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 10
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 MySQL 和 PostgreSQL 的常用配置项、默认端口和主要管理工具
  - 解释用户、权限、角色之间的关系和最小权限原则
  skill:
  - 使用 CREATE USER、GRANT、REVOKE 为不同岗位建账号并授权，用 mysqldump 完成备份和恢复
  - 说明全量备份、增量备份和二进制日志各自的作用，能为小店设计一个简单的备份策略
  - 判断一个数据库系统存在哪些安全隐患，并提出访问控制、加密、脱敏等防护办法
  quality:
  - 树立数据安全和个人信息保护意识，遵守《数据安全法》《个人信息保护法》
  - 养成定期备份、演练恢复的运维习惯
key_points:
- MySQL 的安装与配置文件
- PostgreSQL 与 MySQL 的写法差异
- 用户、权限、角色与最小权限原则
- mysqldump 备份与恢复
- 二进制日志与时间点恢复
- SQL 注入与数据脱敏
difficulties:
- point: 权限的粒度（库、表、列）和角色
  solution: 按收银员、会计、店长三个岗位设计权限表，实验 10-1 中用不同账号登录验证“能做什么、不能做什么”
- point: 用二进制日志做时间点恢复
  solution: 画时间线：全量备份 → 正常业务 → 误删 → 恢复，标出备份和二进制日志各负责哪一段
