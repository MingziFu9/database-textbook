homework:
- 简答题：什么是最小权限原则？以“学生选课系统”为例，说明学生、任课教师、教务员三类账号分别应该有哪些权限。
- 简答题：什么是全量备份和增量备份？二进制日志在恢复中起什么作用？
- 简答题：用户在登录框的用户名处输入 `' OR '1'='1`，程序用拼接字符串的方式生成 `SELECT * FROM users WHERE username = '输入' AND …`。说明这会造成什么问题，以及从程序和数据库两方面怎样防范。
- 实操题：选课库 school 中有 student、course、sc 三张表。写出 SQL：① 创建只能从 192.168.10 网段登录的账号 teacher_li，口令为 `Li#2026`；② 授予他查询 student、course 表，以及查询和修改 sc 表 grade 列的权限；③ 查看他的权限；④ 学期结束后，收回他修改成绩的权限。
- 实操题：写出命令：① 用 mysqldump 把 school 库（含存储过程和触发器）备份到 `D:\backup\school.sql`；② school 库被误删后，用这个文件恢复。说明这两条命令应该在哪里运行，并为学校的选课系统设计一个简单的备份策略（备份频率、保留时间、存放位置、验证方法各一句）。
- 实验报告：实验 10-1、实验 10-2、实验 10-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
