# 第 2 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 2
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出关系、元组、属性、域、关系模式等术语，并对应到表、行、列
  - 解释超键、候选键、主键、外键的含义，能在一组表里找出主键和外键
  - 说出选择、投影、连接、并、差五种关系运算的作用，能看懂简单的关系代数表达式
  skill:
  - 判断一条数据违反了哪一类完整性约束，并说出数据库会怎样处理
  - 把一张“大杂烩”表拆成几张通过外键联系的表
  quality:
  - 体会“用规则保证数据正确”的思想，养成严谨对待数据的职业习惯
key_points:
- 关系模型的三要素
- 关系的术语：关系、元组、属性、域、关系模式
- 候选键、主键、外键
- 三类完整性约束
- 选择、投影、连接运算
difficulties:
- point: 超键、候选键、主键三者的关系
  solution: 从“能不能唯一确定一行”出发，用小店顾客表逐步去掉多余的列，配合“主键与外键”动画
- point: 外键和参照完整性的作用
  solution: 在动画和实验 2-2 中故意插入不存在的顾客编号，看 1452 报错，再讨论“为什么要拒绝”
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 20
    content: 2.1 数据模型与关系模型：什么是数据模型、关系模型的三要素
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 说出关系模型的三要素
  - name: 自主学习
    minutes: 20
    content: 2.2 关系的基本术语：表、行、列和它们的“学名”、一张表要成为“关系”需要满足的条件
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 把表、行、列和关系、元组、属性对应起来
  - name: 自主学习
    minutes: 50
    content: 2.3 键：用什么来找到一行：超键、候选键与主键、外键
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画、在“试一试”框里运行 SQL，完成节后小测
    intent: 会找候选键、主键和外键
  - name: 自主学习
    minutes: 40
    content: 2.4 完整性约束：数据必须遵守的规则：三类完整性、数据库怎样把关
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 说出三类完整性及数据库怎样把关
  - name: 自主学习
    minutes: 40
    content: 2.5 关系运算：对表做“加减乘除”：为什么要学关系运算、选择与投影、连接、并、差、交与笛卡尔积
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画、在“试一试”框里运行 SQL，完成节后小测
    intent: 会用选择、投影、连接描述查询
  - name: 自主学习
    minutes: 10
    content: 2.6 前沿视窗：关系模型 50 多年，为什么还是主流
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解关系模型长期是主流的原因
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林决定把小店的数据搬进数据库。第一步，他照着原来的 Excel 建了一张“销售流水”大表，每卖一样东西记一行……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 2.3 键：用什么来找到一行：超键、候选键与主键、外键
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会找候选键、主键和外键
  - name: 重点讲解
    minutes: 10
    content: 2.4 完整性约束：数据必须遵守的规则：三类完整性、数据库怎样把关
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 说出三类完整性及数据库怎样把关
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 2-1 浏览小店示例库，找出主键和外键
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是实体完整性和参照完整性？各举一个社区小店的例子。
- 简答题：为什么不把所有信息放在一张大表里，而要拆成多张表？拆开后怎么得到完整信息？
- 简答题：说出关系代数表达式 \( \pi_{\text}(\sigma_{\text<5}(\text)) \) 的含义，并写出对应的 SQL。
- 实操题：学生选课数据库有三张表：学生（学号，姓名，专业），课程（课程号，课程名，学分），选课（学号，课程号，成绩）。写出三个关系模式，标出主键（画横线）和外键（标 *）。
- 实操题：在网页“试一试”里，分别写出实现“选择”和“投影”的 SQL：① 查出库存为 0 的商品的全部信息；② 查出所有供应商所在的城市（不重复）。
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
