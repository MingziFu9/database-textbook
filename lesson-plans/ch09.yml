# 第 9 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 9
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出事务的概念和 ACID 四个特性，并各举一个小店的例子
  - 解释脏读、不可重复读、幻读的含义，以及四种隔离级别分别能防止哪几种问题
  skill:
  - 使用 START TRANSACTION、COMMIT、ROLLBACK 完成一次可靠的下单操作
  - 编写带参数和流程控制的存储过程、简单的存储函数和触发器
  - 判断一项业务规则适合放在存储过程、触发器里，还是放在应用程序里
  quality:
  - 体会事务对资金、库存等数据一致性的重要性，培养责任意识
  - 了解国产分布式数据库的发展，增强技术自信
key_points:
- 事务的提交、回滚与 ACID
- 三种并发问题和四种隔离级别
- 存储过程与存储函数
- 触发器
- 事件
difficulties:
- point: 脏读、不可重复读、幻读的区别和四种隔离级别
  solution: 用“隔离级别与并发问题”动画按时间顺序逐步演示，再在实验 9-2 中用两个会话亲手复现
- point: 存储过程中的变量、流程控制和 DELIMITER
  solution: 从最简单的无参存储过程开始，逐步加参数、IF、循环；强调命令行里必须改 DELIMITER
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 50
    content: 9.1 事务：要么全做，要么全不做、自动提交、事务的四个特性
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用事务保证下单操作的一致性
  - name: 自主学习
    minutes: 45
    content: 9.2 并发与隔离级别：并发带来的三种问题、四种隔离级别、编者实测、锁
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 能说出三种并发问题和隔离级别的作用
  - name: 自主学习
    minutes: 25
    content: 9.3 变量与流程控制：用户变量、局部变量和流程控制
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会使用用户变量和局部变量
  - name: 自主学习
    minutes: 45
    content: 9.4 存储过程与存储函数：存储过程、带流程控制和输出参数、存储函数、什么时候用存储过程
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会创建和调用存储过程、存储函数
  - name: 自主学习
    minutes: 25
    content: 9.5 触发器：自动执行的“开关”、卖出商品自动扣库存、改价日志、触发器的风险
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用触发器自动维护数据，知道风险
  - name: 自主学习
    minutes: 25
    content: 9.6 事件：定时执行的任务
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会建定时执行的事件
  - name: 自主学习
    minutes: 10
    content: 9.7 前沿视窗：分布式事务与国产数据库
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解分布式事务和国产分布式数据库
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：网上订货开通第一周，小林就遇到了两件怪事。
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 9.1 事务：要么全做，要么全不做、自动提交、事务的四个特性
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会用事务保证下单操作的一致性
  - name: 重点讲解
    minutes: 10
    content: 9.2 并发与隔离级别：并发带来的三种问题、四种隔离级别、编者实测、锁
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 能说出三种并发问题和隔离级别的作用
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 9-1 用事务完成下单
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 线上实验
    minutes: 45
    content: 实验 9-2 两个会话演示隔离级别
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是事务？用小店下单的例子说明为什么需要事务。
- 简答题：说明四种隔离级别分别能防止哪些并发问题。
- 简答题：比较存储过程和触发器：它们分别怎样被执行？各适合做什么？
- 实操题：学生选课库中有表 sc(sno, cno, grade) 和 student(sno, sname, total_credit)、course(cno, cname, credit)。写一个存储过程 sp_student_avg(IN p_sno CHAR(10), OUT p_avg DECIMAL(4,1))，求某个学生所有课程的平均成绩，并写出调用和查看结果的语句。
- 实操题：接上题，写一个触发器：当 sc 表插入一条选课记录且成绩 grade 不低于 60 时，自动把该课程的学分加到 student 表的 total_credit 上。
- 实验报告：实验 9-1、实验 9-2、实验 9-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
