# 第 4 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 4
online: 7
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 SELECT 语句各个子句的作用，以及它们的书写顺序和执行顺序
  - 解释为什么 WHERE 里不能用列别名、WHERE 和 HAVING 有什么区别
  skill:
  - 写出带筛选、排序、分页、计算列和函数的单表查询
  - 用 COUNT、SUM、AVG、MAX、MIN 和 GROUP BY、HAVING 完成分组统计
  - 判断含 NULL 的数据在比较、计数和求平均时会得到什么结果
  quality:
  - 养成把业务问题准确“翻译”成查询、并核对结果合理性的习惯
  - 认识统计口径（如是否排除退款订单）对结论的影响，实事求是地报告数据
key_points:
- WHERE 的各种条件写法
- ORDER BY 与 LIMIT
- 常用字符串、日期和条件函数
- 聚合函数、GROUP BY 与 HAVING
- SQL 的书写顺序和执行顺序
- NULL 的处理
difficulties:
- point: WHERE 与 HAVING 的区别，以及“WHERE 里不能用别名、不能用聚合函数”
  solution: 用“SELECT 的执行顺序”动画逐步演示每一步之后的中间表，让学生自己说出原因
- point: NULL 在比较、计数和求平均时的结果
  solution: 用 5、3、NULL、4 四个数手算 COUNT 和 AVG，再在“试一试”框里验证
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 20
    content: 4.1 SELECT 的基本用法：选择列、别名和计算列、去掉重复
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会选列、起别名、写计算列、去重
  - name: 自主学习
    minutes: 45
    content: 4.2 WHERE：筛选行：比较运算、BETWEEN、IN、LIKE、IS NULL、AND、OR、NOT 与括号
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会写各种筛选条件
  - name: 自主学习
    minutes: 20
    content: 4.3 排序与分页：ORDER BY、LIMIT
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会排序和分页
  - name: 自主学习
    minutes: 20
    content: 4.4 常用函数：字符串函数、数值函数、日期函数、条件函数
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 会用常用函数加工数据
  - name: 自主学习
    minutes: 45
    content: 4.5 聚合与分组：聚合函数、GROUP BY、HAVING
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画、在“试一试”框里运行 SQL，完成节后小测
    intent: 会做分组统计并筛选分组
  - name: 自主学习
    minutes: 45
    content: 4.6 SQL 的书写顺序和执行顺序
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画、在“试一试”框里运行 SQL，完成节后小测
    intent: 能用执行顺序解释常见报错
  - name: 自主学习
    minutes: 20
    content: 4.7 NULL 的坑
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、在“试一试”框里运行 SQL，完成节后小测
    intent: 避开 NULL 带来的错误
  - name: 自主学习
    minutes: 10
    content: 4.8 前沿视窗：用大白话问数据
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解用自然语言查数据的思路
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林把数据导进 myshop 以后，老板第二天一早就来“考”他了……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 4.2 WHERE：筛选行：比较运算、BETWEEN、IN、LIKE、IS NULL、AND、OR、NOT 与括号
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会写各种筛选条件
  - name: 重点讲解
    minutes: 15
    content: 4.5 聚合与分组：聚合函数、GROUP BY、HAVING
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 会做分组统计并筛选分组
  - name: 重点讲解
    minutes: 15
    content: 4.6 SQL 的书写顺序和执行顺序
    teacher: 精讲本节重点和难点，结合交互动画、例题和现场运行 SQL 演示，针对线上小测中的错误答疑
    student: 跟着运行和推导、回答提问，订正线上小测中的错误
    intent: 能用执行顺序解释常见报错
  - name: 分层练习
    minutes: 20
    content: 按基础题、提高题两层安排本章重点内容的课堂练习（写 SQL 或设计题），学生独立完成后同桌互查
    teacher: 分层布置练习，巡视指导，投屏讲评典型错误
    student: 独立完成练习，上机验证，同桌互查
    intent: 通过练习突破本章难点
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 18 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 4-1 回答老板的十个问题
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 线上实验
    minutes: 45
    content: 实验 4-2 按月、按商品、按类别统计
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：写出 SELECT 语句各子句的书写顺序和执行顺序，并用执行顺序解释“为什么 WHERE 里不能使用列别名”。
- 简答题：比较 WHERE 和 HAVING 的区别，各举一个例子。
- 简答题：举例说明 NULL 在比较和求平均时可能造成的错误，以及如何避免。
- 实操题：基于示例库 shop 写出 SQL：① 查询售价在 20～50 元之间、库存少于 50 件的商品名称、售价和库存，按售价从高到低排列；② 查询每个职位（position）的员工人数和平均工资（保留 2 位小数），只显示人数不少于 2 人的职位。
- 实操题：基于示例库 shop 的 orders 表写出 SQL：统计 2025 年每个月用现金支付的订单数，按月份排序；再用 CASE WHEN 把每个月标为“多”（不少于 15 单）或“少”。
- 实验报告：实验 4-1、实验 4-2、实验 4-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
